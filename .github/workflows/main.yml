name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Conferir index.html
        run: |
          if [ ! -f index.html ]; then echo "ERRO: falta o arquivo index.html na raiz do repositorio"; ls -la; exit 1; fi
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.jet.escala","appName":"Escala JET","webDir":"www"}' > capacitor.config.json

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: escala-jet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Escala JET v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

